name: linter

# Formatting is a CHECK, not a fix (changed 2026-08-03).
#
# This job used to run Pint/Prettier in WRITE mode with an auto-commit step that
# was commented out — so CI reformatted its own checkout, threw the result away,
# and always reported green. Formatting was enforced by nobody, and the repo
# silently drifted to 67 Pint + 92 Prettier files out of style, which makes a real
# diff unreviewable the moment anyone does run a formatter locally.
#
# Fix locally with `./vendor/bin/pint` + `npm run format` before pushing.
on:
  push:
    # Must match ci.yml. The old list named `develop`, a branch that has never
    # existed in this repo, so this workflow only ever ran on `main`.
    branches: [main, construction_phase, deployment_phase]
  pull_request:

permissions:
  # Read-only: nothing writes back now that the auto-commit step is gone.
  contents: read

jobs:
  quality:
    name: Format + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches ci.yml and the deployment target (composer requires ^8.2).
          php-version: '8.2'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Check PHP formatting (Pint)
        run: vendor/bin/pint --test

      - name: Check frontend formatting (Prettier)
        run: npm run format:check

      - name: Lint frontend (ESLint)
        run: npm run lint:check

name: CI

on:
  push:
    branches: [main, construction_phase, deployment_phase]
  pull_request:

jobs:
  backend:
    name: PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, gd
          coverage: none

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      # In-memory SQLite via phpunit.xml; Vite is faked in tests/TestCase.php,
      # so no asset build is needed here.
      - name: Run tests
        run: php artisan test

  frontend:
    name: Types + builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Vite/esbuild strips types without checking — tsc is the real gate.
      - name: Type check
        run: npx tsc --noEmit

      # Pure front-end helpers (e.g. cookie-consent logic) run under Vitest.
      - name: JS unit tests
        run: npm run test:js

      - name: Client build
        run: npm run build

      - name: SSR build
        run: npm run build:ssr

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # HARD GATE since 2026-08-03. It ran report-only (continue-on-error) while the
    # suite proved itself — but on 2026-07-29 that masked a real P1: the blank
    # product page (a camelCase Inertia prop mismatch) failed this suite and CI
    # still reported green. An Inertia prop-name mismatch is invisible to both tsc
    # and PHPUnit status assertions, so this job is the ONLY thing that catches
    # that class of bug. It must be allowed to fail the run.
    # Flake mitigation lives in playwright.config.ts (retries: 1 under CI).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      # The E2E server serves the built assets (no Vite dev server in CI).
      - name: Build assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # No QA_BASE_URL → Playwright boots its own freshly-seeded SQLite app
      # (webServer in playwright.config.ts) and runs the suite against it.
      - name: Run E2E
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

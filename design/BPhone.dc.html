<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif; }
    a { color: #af9056; text-decoration: none; }
    a:hover { color: #c9a76a; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<!-- B · LEDGER — phone. The teal hero becomes the whole first screen: one glance
     answers "how are we doing", and the work sits under it. -->
<div style="width: 390px; height: 844px; background: #0d0d0d; color: #f5f1ea; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">

  <!-- Teal hero runs to the top edge; the device status bar sits over it. -->
  <div style="background: linear-gradient(160deg, #1b4e53 0%, #14383c 100%); padding: 56px 20px 22px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 11px">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: #af9056; display: flex; align-items: center; justify-content: center">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#133c40" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M5 8c3 0 5 2 7 4M19 8c-3 0-5 2-7 4"/></svg>
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 13px; font-weight: 600">Good morning</span>
        <span style="font-size: 10px; color: #7f9fa1">Wednesday, 20 August</span>
      </div>
      <div style="flex-grow: 1"></div>
      <div style="width: 40px; height: 40px; border-radius: 11px; background: #ffffff14; display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d9e6e7" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10.3 21a2 2 0 0 0 3.4 0"/></svg>
        <span style="position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: #f59e0b"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 3px; padding-top: 6px">
      <span style="font-size: 11px; color: #9fc0c2; letter-spacing: 0.04em">REVENUE · LAST 30 DAYS</span>
      <div style="display: flex; align-items: baseline; gap: 9px">
        <span style="font-size: 42px; font-weight: 700; letter-spacing: -0.035em; color: #d9bc82; line-height: 1.05">48,320</span>
        <span style="font-size: 15px; color: #9fc0c2">SAR</span>
      </div>
      <div style="display: flex; align-items: center; gap: 7px; margin-top: 3px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7fd1a0" stroke-width="2.4" stroke-linecap="round"><path d="M4 17l7-7 4 4 6-6M15 8h6v6"/></svg>
        <span style="font-size: 12px; font-weight: 600; color: #7fd1a0">+12%</span>
        <span style="font-size: 12px; color: #7f9fa1">· 176 orders · 1,840 today</span>
      </div>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 3px; height: 44px; border-bottom: 1px solid #2c5f64">
      <sc-for list="{{trend}}" as="d" hint-placeholder-count="20">
        <div style="flex-grow: 1; border-radius: 2px 2px 0 0; background: {{d.fill}}; height: {{d.h}}"></div>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; gap: 9px">
      <span style="font-weight: 600; font-size: 14px">Needs attention</span>
      <span style="font-size: 11px; color: #8a8175">2 time-sensitive</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px">
      <sc-for list="{{queue}}" as="q" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 12px 15px; border-radius: 13px; background: {{q.bg}}; border: 1px solid {{q.border}}">
          <span style="width: 34px; font-size: 23px; font-weight: 700; letter-spacing: -0.03em; color: {{q.num}}">{{q.count}}</span>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13px; font-weight: 600">{{q.label}}</span>
            <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.05em; color: {{q.tag}}">{{q.urgency}}</span>
          </div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5c564c" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="height: 64px; flex-shrink: 0; border-top: 1px solid #23201b; background: #15130f; display: flex; align-items: stretch">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: {{t.color}}">
        <div style="width: 18px; height: 18px; border-radius: 5px; border: 2px solid {{t.color}}"></div>
        <span style="font-size: 10px; font-weight: 500">{{t.label}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"heroTint":{"editor":"color","default":"#1b4e53","options":["#1b4e53","#133c40","#2a2119","#0d0d0d"]}}'>
class Component extends DCLogic {
  renderVals() {
    const bars = [40, 55, 46, 64, 52, 76, 60, 42, 70, 58, 85, 50, 66, 73, 55, 90, 64, 48, 78, 100];
    return {
      trend: bars.map((h, i) => ({ h: h + '%', fill: i >= bars.length - 2 ? '#af9056' : '#2c5f64' })),
      queue: [
        { count: '2', label: 'Bank transfers to verify', urgency: 'TIME-SENSITIVE', bg: '#f59e0b0f', border: '#f59e0b3d', tag: '#d9a441', num: '#e8b45c' },
        { count: '1', label: 'Tamara hold expiring', urgency: '~11 HOURS LEFT', bg: '#f59e0b0f', border: '#f59e0b3d', tag: '#d9a441', num: '#e8b45c' },
        { count: '9', label: 'Orders to confirm', urgency: 'TODAY', bg: '#15130f', border: '#23201b', tag: '#8a8175', num: '#f5f1ea' },
        { count: '10', label: 'Ready to ship', urgency: 'TODAY', bg: '#15130f', border: '#23201b', tag: '#8a8175', num: '#f5f1ea' },
        { count: '2', label: 'Returns to review', urgency: 'THIS WEEK', bg: '#15130f', border: '#23201b', tag: '#8a8175', num: '#f5f1ea' },
      ],
      tabs: [
        { label: 'Home', color: '#af9056' },
        { label: 'Orders', color: '#5c564c' },
        { label: 'Products', color: '#5c564c' },
        { label: 'More', color: '#5c564c' },
      ],
    };
  }
}
</script>
</body>
</html>

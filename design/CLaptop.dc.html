<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif; }
    a { color: #af9056; text-decoration: none; }
    a:hover { color: #c9a76a; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<!-- C · SIGNAL — analytics-forward. A real chart with axes, KPI cards that carry their
     own history, and the work as a persistent right rail you never scroll away from. -->
<div style="width: 1280px; height: 860px; display: flex; background: #09090b; color: #fafafa; font-size: 14px; overflow: hidden">

  <div style="width: 62px; flex-shrink: 0; border-right: 1px solid #1c1c1f; display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 7px">
    <div style="width: 32px; height: 32px; border-radius: 9px; background: #af9056; display: flex; align-items: center; justify-content: center; margin-bottom: 10px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#09090b" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M5 8c3 0 5 2 7 4M19 8c-3 0-5 2-7 4"/></svg>
    </div>
    <sc-for list="{{rail}}" as="r" hint-placeholder-count="6">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: {{r.bg}}; display: flex; align-items: center; justify-content: center">
        <div style="width: 16px; height: 16px; border-radius: 4px; border: 2px solid {{r.fg}}"></div>
      </div>
    </sc-for>
  </div>

  <!-- Content -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
    <div style="height: 58px; flex-shrink: 0; border-bottom: 1px solid #1c1c1f; display: flex; align-items: center; gap: 14px; padding: 0 24px">
      <span style="font-weight: 600; font-size: 15px">Overview</span>
      <div style="display: flex; gap: 3px; margin-left: 10px; background: #131316; border-radius: 9px; padding: 3px">
        <sc-for list="{{ranges}}" as="r" hint-placeholder-count="3">
          <div style="padding: 5px 13px; border-radius: 7px; font-size: 12px; font-weight: 500; background: {{r.bg}}; color: {{r.fg}}">{{r.label}}</div>
        </sc-for>
      </div>
      <div style="flex-grow: 1"></div>
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #1c1c1f"></div>
    </div>

    <div style="flex-grow: 1; display: grid; grid-template-columns: 1fr 316px; min-height: 0">

      <!-- Left: the numbers -->
      <div style="padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

        <!-- KPI cards each carry their own sparkline, so the number has context
             without a second chart. -->
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px">
          <sc-for list="{{kpis}}" as="k" hint-placeholder-count="3">
            <div style="border: 1px solid #1c1c1f; border-radius: 13px; background: #131316; padding: 15px 16px; display: flex; flex-direction: column; gap: 9px">
              <span style="font-size: 11px; color: #71717a">{{k.label}}</span>
              <div style="display: flex; align-items: baseline; gap: 7px">
                <span style="font-size: 25px; font-weight: 700; letter-spacing: -0.03em">{{k.value}}</span>
                <span style="font-size: 11px; font-weight: 600; color: {{k.tone}}">{{k.delta}}</span>
              </div>
              <div style="display: flex; align-items: flex-end; gap: 2px; height: 26px">
                <sc-for list="{{k.spark}}" as="b" hint-placeholder-count="16">
                  <div style="flex-grow: 1; border-radius: 1px; background: {{b.fill}}; height: {{b.h}}"></div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>

        <!-- A proper chart: gridlines, a y axis with real values, labelled x. -->
        <div style="border: 1px solid #1c1c1f; border-radius: 13px; background: #131316; padding: 17px 19px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1; min-height: 0">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="font-weight: 600; font-size: 13px">Revenue</span>
            <div style="flex-grow: 1"></div>
            <div style="display: flex; align-items: center; gap: 6px">
              <span style="width: 9px; height: 3px; border-radius: 2px; background: #af9056"></span>
              <span style="font-size: 11px; color: #71717a">This period</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px; margin-left: 10px">
              <span style="width: 9px; height: 3px; border-radius: 2px; background: #3f3f46"></span>
              <span style="font-size: 11px; color: #71717a">Previous</span>
            </div>
          </div>

          <div style="display: flex; gap: 11px; flex-grow: 1; min-height: 0">
            <div style="display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0 17px; width: 34px">
              <sc-for list="{{yAxis}}" as="y" hint-placeholder-count="4">
                <span style="font-size: 10px; color: #52525b; text-align: right">{{y.label}}</span>
              </sc-for>
            </div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
              <div style="flex-grow: 1; position: relative; min-height: 0">
                <sc-for list="{{gridlines}}" as="g" hint-placeholder-count="4">
                  <div style="position: absolute; left: 0; right: 0; top: {{g.top}}; height: 1px; background: #1c1c1f"></div>
                </sc-for>
                <div style="position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 3px">
                  <sc-for list="{{series}}" as="d" hint-placeholder-count="30">
                    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%">
                      <div style="border-radius: 3px 3px 0 0; background: {{d.fill}}; height: {{d.h}}"></div>
                    </div>
                  </sc-for>
                </div>
              </div>
              <div style="display: flex; justify-content: space-between; padding-top: 7px">
                <sc-for list="{{xAxis}}" as="x" hint-placeholder-count="5">
                  <span style="font-size: 10px; color: #52525b">{{x.label}}</span>
                </sc-for>
              </div>
            </div>
          </div>
        </div>

        <div style="border: 1px solid #1c1c1f; border-radius: 13px; background: #131316; padding: 15px 18px; display: flex; align-items: center; gap: 22px">
          <span style="font-size: 12px; color: #71717a; white-space: nowrap">Inventory</span>
          <sc-for list="{{stock}}" as="s" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="width: 7px; height: 7px; border-radius: 50%; background: {{s.dot}}"></span>
              <span style="font-size: 16px; font-weight: 700">{{s.n}}</span>
              <span style="font-size: 11px; color: #71717a">{{s.label}}</span>
            </div>
          </sc-for>
          <div style="flex-grow: 1"></div>
          <span style="font-size: 11px; color: #fbbf24">Synced 5 weeks ago</span>
        </div>
      </div>

      <!-- Right rail: the work, always visible, never scrolled past. -->
      <div style="border-left: 1px solid #1c1c1f; background: #0c0c0e; padding: 20px 18px; display: flex; flex-direction: column; gap: 13px; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="font-weight: 600; font-size: 13px">Needs attention</span>
          <span style="font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: #f59e0b1f; color: #fbbf24">24</span>
        </div>

        <sc-for list="{{queue}}" as="q" hint-placeholder-count="5">
          <div style="border: 1px solid {{q.border}}; border-radius: 11px; background: {{q.bg}}; padding: 12px 13px; display: flex; flex-direction: column; gap: 7px">
            <div style="display: flex; align-items: center; gap: 9px">
              <span style="width: 6px; height: 6px; border-radius: 50%; background: {{q.dot}}"></span>
              <span style="flex-grow: 1; font-size: 12px; font-weight: 600">{{q.label}}</span>
              <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: {{q.num}}">{{q.count}}</span>
            </div>
            <span style="font-size: 10px; color: #71717a; line-height: 1.4">{{q.why}}</span>
          </div>
        </sc-for>

        <div style="flex-grow: 1"></div>

        <div style="border-top: 1px solid #1c1c1f; padding-top: 13px; display: flex; flex-direction: column; gap: 9px">
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #52525b">CUSTOMERS</span>
          <div style="display: flex; align-items: baseline; gap: 9px">
            <span style="font-size: 21px; font-weight: 700">22</span>
            <span style="font-size: 11px; color: #4ade80">+4 this month</span>
          </div>
          <span style="font-size: 11px; color: #71717a">9 opted in to WhatsApp · 6 one order from a reward</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"chartColor":{"editor":"color","default":"#af9056","options":["#af9056","#1b4e53","#22c55e","#6366f1"]}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (arr, hot) => arr.map((h, i) => ({ h: h + '%', fill: i >= arr.length - hot ? '#af9056' : '#2a2a2e' }));
    const main = [34, 48, 40, 57, 45, 68, 54, 37, 62, 51, 77, 43, 59, 66, 48, 84, 57, 41, 70, 55, 88, 64, 47, 73, 60, 92, 67, 54, 79, 100];
    return {
      rail: [
        { bg: '#1c1c1f', fg: '#af9056' },
        { bg: 'transparent', fg: '#3f3f46' },
        { bg: 'transparent', fg: '#3f3f46' },
        { bg: 'transparent', fg: '#3f3f46' },
        { bg: 'transparent', fg: '#3f3f46' },
        { bg: 'transparent', fg: '#3f3f46' },
      ],
      ranges: [
        { label: '7d', bg: 'transparent', fg: '#71717a' },
        { label: '30d', bg: '#27272a', fg: '#fafafa' },
        { label: '90d', bg: 'transparent', fg: '#71717a' },
      ],
      kpis: [
        { label: 'Revenue', value: '48,320', delta: '+12%', tone: '#4ade80', spark: mk([40, 55, 48, 62, 50, 71, 58, 44, 66, 54, 80, 47, 63, 72, 58, 100], 2) },
        { label: 'Orders', value: '176', delta: '+8%', tone: '#4ade80', spark: mk([50, 42, 61, 48, 70, 55, 38, 66, 52, 74, 46, 62, 58, 80, 64, 92], 2) },
        { label: 'Average order', value: '275', delta: '+4%', tone: '#4ade80', spark: mk([60, 55, 64, 58, 70, 62, 52, 68, 60, 72, 57, 66, 63, 74, 68, 78], 2) },
      ],
      yAxis: [{ label: '3k' }, { label: '2k' }, { label: '1k' }, { label: '0' }],
      gridlines: [{ top: '0%' }, { top: '33%' }, { top: '66%' }, { top: '100%' }],
      series: main.map((h, i) => ({ h: h + '%', fill: i >= main.length - 3 ? '#af9056' : '#2a2a2e' })),
      xAxis: [{ label: '22 Jul' }, { label: '29 Jul' }, { label: '5 Aug' }, { label: '12 Aug' }, { label: '20 Aug' }],
      stock: [
        { n: '5', label: 'out', dot: '#f87171' },
        { n: '5', label: 'low', dot: '#fbbf24' },
        { n: '28', label: 'active', dot: '#4ade80' },
        { n: '63', label: 'drafts', dot: '#52525b' },
      ],
      queue: [
        { count: '2', label: 'Bank transfers', why: 'Money sent, order not moving', bg: '#f59e0b0d', border: '#f59e0b33', dot: '#f59e0b', num: '#fbbf24' },
        { count: '1', label: 'Tamara expiring', why: '~11h before the hold lapses', bg: '#f59e0b0d', border: '#f59e0b33', dot: '#f59e0b', num: '#fbbf24' },
        { count: '9', label: 'To confirm', why: 'Paid, waiting on a stock check', bg: '#131316', border: '#1c1c1f', dot: '#af9056', num: '#fafafa' },
        { count: '10', label: 'Ready to ship', why: 'Confirmed, no courier booked', bg: '#131316', border: '#1c1c1f', dot: '#52525b', num: '#fafafa' },
        { count: '2', label: 'Returns', why: 'Filed within the 3-day window', bg: '#131316', border: '#1c1c1f', dot: '#52525b', num: '#fafafa' },
      ],
    };
  }
}
</script>
</body>
</html>
